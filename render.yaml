# Render Blueprint: the free, no-card deployment. One web service runs the
# API, worker and web app (deploy/); Redis is Render Key Value on the
# private network; PostgreSQL is Neon, set by hand. See docs/infra/DEPLOYMENT.md.

services:
  - type: web
    name: labops
    runtime: docker
    plan: free
    # Keep this and the Key Value region the same as the Neon project's.
    region: singapore
    dockerfilePath: ./deploy/Dockerfile
    # Deploy only after every CI check on the commit passes, so code that fails
    # lint, tests or the deploy image smoke never goes live.
    autoDeployTrigger: checksPass
    dockerContext: .
    healthCheckPath: /login
    envVars:
      # Neon's direct (unpooled) connection string, with sslmode=require.
      # Migrations take an advisory lock, which a pooled connection drops.
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: labops-redis
          property: connectionString
      - key: SEED_OPERATOR_USERNAME
        value: demo
      # 12+ characters. Shared privately with reviewers, never committed.
      - key: SEED_OPERATOR_PASSWORD
        sync: false
      # Base64 of 32 random bytes, which is what generateValue produces.
      - key: CREDENTIALS_KEY
        generateValue: true
      - key: LLM_PROVIDER
        value: fixture
      # Each boot resets the demo if it has been idle 10 minutes, so every wake
      # from sleep starts fresh while a deploy beside a running container keeps
      # it; boots take a lock (deploy/start.sh). Demo only: the reset refuses
      # any database holding non-simulated data.
      - key: DEMO_RESET_ON_BOOT
        value: "true"

  - type: keyvalue
    name: labops-redis
    plan: free
    region: singapore
    # Empty: reachable only over Render's private network.
    ipAllowList: []
    # BullMQ needs every key kept; the default policy would evict queued jobs.
    maxmemoryPolicy: noeviction
