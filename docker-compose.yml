services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: labops
      POSTGRES_PASSWORD: labops
      POSTGRES_DB: labops
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labops"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      # Overridable when another project already holds 6379 on the host.
      - "${REDIS_HOST_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # One-shot: applies checked-in migrations, then exits. It uses the build
  # stage because the runtime image omits the Prisma CLI (a dev dependency).
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    # Then seeds the demo operator. An unset password seeds nobody, so the
    # stack still boots; set SEED_OPERATOR_PASSWORD in the root .env to sign in.
    environment:
      DATABASE_URL: postgresql://labops:labops@postgres:5432/labops
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-operator}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
    command:
      - sh
      - -c
      - npm run prisma:migrate -w @labops/api && node apps/api/dist/seed-operator.js
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      DATABASE_URL: postgresql://labops:labops@postgres:5432/labops
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      CORS_ORIGIN: http://localhost:3000
      # Compose is the local/demo stack; the demo routes stay off elsewhere.
      DEMO_ENABLED: "true"
      # Served over plain http on localhost, so the cookie cannot be Secure here.
      SESSION_COOKIE_SECURE: "false"
      # Optional Google sign-in from the root .env; empty means off.
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  # Same image as the api, different entrypoint; it never serves HTTP.
  worker:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      DATABASE_URL: postgresql://labops:labops@postgres:5432/labops
      REDIS_URL: redis://redis:6379
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
      API_INTERNAL_URL: http://api:4000
      # The web app holds the operator's session cookie (BFF); plain http here.
      SESSION_COOKIE_SECURE: "false"
    ports:
      # Overridable when another project already holds 3000 on the host.
      - "${WEB_HOST_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data: