# Production stack. Standalone on purpose, not an overlay on docker-compose.yml.
#
#   docker compose -f docker-compose.prod.yml up -d --build
#
# It was an overlay first, and that was wrong: compose merges sequences rather
# than replacing them, so the development file's `ports:` on postgres, redis and
# web survived and the database was published to the internet anyway. A security
# boundary should be one file you can read end to end, not a patch on a file
# whose exposure changes when someone edits an unrelated service.
#
# What is different from development, and why:
#   * Only `proxy` publishes a port. Postgres and Redis are unreachable from
#     outside this network.
#   * APP_ENV=production, which makes the API refuse to boot on a cookie that is
#     not Secure, a missing proxy hop count, or demo routes being enabled.
#   * TRUST_PROXY_HOPS=1, matching the single Caddy hop. Without it every request
#     looks like it came from the proxy and the rate limit stops being per-client.
#   * Logs are size-capped; an uncapped json log fills the disk and takes the
#     audit trail with it.
#   * Every long-running service restarts unless stopped, so a reboot recovers.

name: labops

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-restart: &default-restart
  restart: unless-stopped

services:
  postgres:
    <<: *default-restart
    logging: *default-logging
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-labops}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-labops}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Plain pg_dump output lives here. If the volume above is lost, this is
      # what remains, which is why scripts/backup.sh exists.
      - ./backups:/backups
    # Deliberately no ports. The development stack publishes 5432 for a local
    # client; doing that here would expose the database to the internet.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-labops} -d ${POSTGRES_DB:-labops}"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

  redis:
    <<: *default-restart
    logging: *default-logging
    image: redis:7-alpine
    # No persistence: every key is a queue entry or a rate-limit counter, and
    # both rebuild from Postgres. Losing them costs in-flight jobs, not data.
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 256mb
      - --maxmemory-policy
      - allkeys-lru
    # No ports, same as postgres.
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 320m

  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-labops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-labops}
      SEED_OPERATOR_USERNAME: ${SEED_OPERATOR_USERNAME:-operator}
      SEED_OPERATOR_PASSWORD: ${SEED_OPERATOR_PASSWORD:-}
    command:
      - sh
      - -c
      - npm run prisma:migrate -w @labops/api && node apps/api/dist/seed-operator.js
    depends_on:
      postgres:
        condition: service_healthy
    # A one-shot job: it must not be restarted on failure, or a broken migration
    # would loop forever and hold up every dependent service.
    restart: "no"

  api:
    <<: *default-restart
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-labops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-labops}
      REDIS_URL: redis://redis:6379
      API_HOST: 0.0.0.0
      API_PORT: "4000"
      # Same origin behind the proxy, so credentials stay off the cross-origin path.
      CORS_ORIGIN: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
      TRUST_PROXY_HOPS: "1"
      # The site is https. A Secure cookie over http is never sent, so nobody
      # could sign in at all.
      SESSION_COOKIE_SECURE: "true"
      # Demo routes never ship. APP_ENV=production refuses to start if this is true.
      DEMO_ENABLED: "false"
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      GOOGLE_ALLOWED_EMAILS: ${GOOGLE_ALLOWED_EMAILS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    # Reachable from the compose network only; the proxy is the way in.
    expose:
      - "4000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:4000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      # A cold start under load can need a few failures before it settles.
      retries: 5
      start_period: 40s
    deploy:
      resources:
        limits:
          memory: 768m

  worker:
    <<: *default-restart
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    command: ["node", "dist/worker.js"]
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql://${POSTGRES_USER:-labops}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-labops}
      REDIS_URL: redis://redis:6379
      QUEUE_PREFIX: ${QUEUE_PREFIX:-labops}
      SESSION_COOKIE_SECURE: "true"
      DEMO_ENABLED: "false"
      TRUST_PROXY_HOPS: "1"
      CREDENTIALS_KEY: ${CREDENTIALS_KEY:-}
      LLM_PROVIDER: ${LLM_PROVIDER:-fixture}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-gemini-3.1-flash-lite}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 768m

  web:
    <<: *default-restart
    logging: *default-logging
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    environment:
      NODE_ENV: production
      # Server-side calls leave the container. The browser still talks only to
      # the web server, which holds the session in its own httpOnly cookie.
      API_INTERNAL_URL: http://api:4000
      API_PUBLIC_URL: https://${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
    expose:
      - "3000"
    depends_on:
      api:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 512m

  proxy:
    <<: *default-restart
    logging: *default-logging
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      SITE_DOMAIN: ${SITE_DOMAIN:?set SITE_DOMAIN in .env.production}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      # Certificates live here. Losing this volume means re-issuing on restart.
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web
      - api
    deploy:
      resources:
        limits:
          memory: 256m

volumes:
  postgres_data:
  caddy_data:
  caddy_config: