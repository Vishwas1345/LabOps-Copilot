name: web

# Frontend pipeline. Invoked by changes.yml, never triggered directly.
#
# Jobs: build, lint, test, coverage, quality-gate.
#
# Every command runs from the repository root with an explicit -w workspace
# flag. There is deliberately no `defaults.run.working-directory` here: a
# default silently applies to every step including `npm ci`, which installs
# only the current directory's dependencies and leaves the root devDependencies
# (eslint, typescript, vitest) uninstalled.
#
# No integration-test job: the frontend owns no database or queue. The
# end-to-end journey runs in changes.yml against the built compose stack.

on:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Baked in at build time by Next.js, so it must be set during the build
      # and not only at runtime.
      - name: Build
        run: npm run build -w @labops/web
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_URL || 'http://localhost:4000' }}

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w @labops/web

  test:
    name: test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Unit tests
        run: npm run test -w @labops/web

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Thresholds live in vitest.config.ts, so a drop below 70% fails here.
      - name: Collect coverage
        run: npm run coverage -w @labops/web

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: web-coverage
          path: apps/web/coverage
          retention-days: 7

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, test, coverage]
    # Runs even when a dependency failed, so the pipeline always reports why.
    # Without this the gate never executes an assertion: GitHub already fails
    # the workflow when a needs job fails, so a normally-scheduled gate is
    # unreachable exactly when it is needed.
    if: always()

    # No `npm ci` here on purpose: every check below reads committed manifests
    # and the lockfile, not installed packages.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Aggregate pipeline results
        run: |
          {
            echo "### web pipeline"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test (unit) | ${{ needs.test.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
          || [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.test.result }}" != "success" ] \
          || [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::web pipeline incomplete - see the table above"
            exit 1
          fi

      - name: Verify the pipeline contract is intact
        run: node scripts/check-required-scripts.mjs

      - name: Fail on new high or critical advisories
        run: node scripts/audit-gate.mjs

      - name: Scan the repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
