name: keep-warm

# Wakes the live demo on demand. The daily keep-awake ping runs on cron-job.org
# (docs/infra/DEPLOYMENT.md §0): GitHub's scheduler did not fire on time. An
# anonymous GET of the login page, never a sign-in: a sign-in writes an audit
# entry, and the demo only resets once nothing was audited for 10 minutes.

on:
  workflow_dispatch:

permissions: {}

concurrency:
  group: keep-warm
  cancel-in-progress: true

jobs:
  ping:
    name: ping the live demo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # A cold boot takes about 2.5 minutes; the request itself is what wakes
      # it, so a timeout here still leaves it booting. Only the status is kept.
      - run: curl -fsS -o /dev/null --max-time 180 -w '%{http_code}\n' https://labops.onrender.com/login
