name: api

# Backend pipeline. Invoked by changes.yml, never triggered directly.
#
# Jobs: build, lint, test, integration-test, coverage, quality-gate, image.
#
# The gate is split in two on purpose:
#   - checks that belong to one job run in that job (lint, coverage thresholds)
#   - checks that span the whole pipeline run in quality-gate, which uses
#     `if: always()` so it reports even when something upstream already failed.
#     Without always() the gate is unreachable exactly when it matters.

on:
  workflow_call:
    inputs:
      deploy:
        description: Build the container image. Only set by the release pipeline.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: apps/api

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci
        working-directory: .

      # `npm run build` is tsc, which type-checks as it emits. Running a
      # separate --noEmit pass first would duplicate the whole compile.
      - name: Build
        run: npm run build

      - name: Validate the Prisma schema
        run: npx prisma validate

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

  test:
    name: test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # No live LLM call may occur in the default run (CLAUDE.md 8).
      - name: Unit tests
        run: npm run test

  integration-test:
    name: test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labops
          POSTGRES_PASSWORD: labops
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops:labops@localhost:5432/labops_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate

      - name: Apply schema
        run: npm run prisma:push

      # Skipped, not passed, while the integration suite is being written, so
      # CI can never report a green integration run that did not happen. The
      # job turns green by itself the moment the first spec lands.
      - name: Run integration tests
        run: npm run test:integration --if-present

  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, lint, test]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Thresholds live in vitest.config.ts, so a drop below 70% fails here.
      - name: Collect coverage
        run: npm run coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, test, integration-test, coverage]
    # Runs even when a dependency failed, so the pipeline always reports why.
    if: always()

    # No `npm ci` here on purpose: every check below reads committed manifests
    # and the lockfile, not installed packages. Skipping the install saves a
    # full dependency restore.
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Aggregate pipeline results
        run: |
          {
            echo "### api pipeline"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test (unit) | ${{ needs.test.result }} |"
            echo "| test (integration) | ${{ needs.integration-test.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
          || [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.test.result }}" != "success" ] \
          || [ "${{ needs.integration-test.result }}" != "success" ] \
          || [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::api pipeline incomplete - see the table above"
            exit 1
          fi

      - name: Verify the pipeline contract is intact
        run: node scripts/check-required-scripts.mjs

      - name: Fail on new high or critical advisories
        run: node scripts/audit-gate.mjs

      - name: Scan the working tree for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gate]
    if: inputs.deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: labops-api:${{ github.sha }}