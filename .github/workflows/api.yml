name: api

# Backend pipeline. Invoked by changes.yml, never triggered directly.
#
# Jobs: build, lint, test, integration-test, coverage, quality-gate, image.
#
# Every command runs from the repository root with an explicit -w workspace
# flag. There is deliberately no `defaults.run.working-directory` here: a
# default silently applies to every step including `npm ci`, which installs
# only the current directory's dependencies and leaves the root devDependencies
# (eslint, typescript, vitest) uninstalled.

on:
  workflow_call:
    inputs:
      deploy:
        description: Build the container image. Only set by the release pipeline.
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The source imports generated Prisma types (LabStatus, ActorType, ...),
      # so tsc needs the client generated first.
      - name: Generate Prisma client
        run: npm run prisma:generate -w @labops/api

      # `npm run build` is tsc, which type-checks as it emits. Running a
      # separate --noEmit pass first would duplicate the whole compile.
      - name: Build
        run: npm run build -w @labops/api

      - name: Validate the Prisma schema
        run: npm run prisma:validate -w @labops/api
        env:
          # Prisma requires the variable to be present even though `validate`
          # parses the schema without opening a connection.
          DATABASE_URL: postgresql://labops:labops@localhost:5432/labops

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint -w @labops/api

  test:
    name: test (unit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      # Unit tests import app.ts, which constructs a PrismaClient. Generating
      # the client needs no database; without it the import throws.
      - name: Generate Prisma client
        run: npm run prisma:generate -w @labops/api

      # No live LLM call may occur in the default run (CLAUDE.md 8).
      - name: Unit tests
        run: npm run test -w @labops/api

  integration-test:
    name: test (integration)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build, lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labops
          POSTGRES_PASSWORD: labops
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops:labops@localhost:5432/labops_test
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @labops/api

      # The same checked-in migrations that every other environment applies.
      - name: Apply migrations
        run: npm run prisma:migrate -w @labops/api

      # Fails (exit 2) when schema.prisma was edited without a migration, so
      # the schema file and the migration history cannot drift apart.
      - name: Check schema matches migrations
        run: npm run prisma:drift -w @labops/api

      # No --if-present: a missing script must fail this job, not pass it
      # green with zero tests run.
      - name: Run integration tests
        run: npm run test:integration -w @labops/api

  # Coverage counts unit and integration specs together (see
  # apps/api/vitest.coverage.config.ts), so it needs a migrated database.
  coverage:
    name: coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [build, lint, test]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: labops
          POSTGRES_PASSWORD: labops
          POSTGRES_DB: labops_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U labops"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://labops:labops@localhost:5432/labops_test
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Generate Prisma client
        run: npm run prisma:generate -w @labops/api

      - name: Apply migrations
        run: npm run prisma:migrate -w @labops/api

      # Thresholds live in vitest.config.ts, so a drop below 70% fails here.
      - name: Collect coverage
        run: npm run coverage -w @labops/api

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: api-coverage
          path: apps/api/coverage
          retention-days: 7

  quality-gate:
    name: quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [build, lint, test, integration-test, coverage]
    # Runs even when a dependency failed, so the pipeline always reports why.
    # Without this the gate never executes an assertion: GitHub already fails
    # the workflow when a needs job fails, so a normally-scheduled gate is
    # unreachable exactly when it is needed.
    if: always()

    # No `npm ci` here on purpose: every check below reads committed manifests
    # and the lockfile, not installed packages.
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Aggregate pipeline results
        run: |
          {
            echo "### api pipeline"
            echo ""
            echo "| Job | Result |"
            echo "| --- | ------ |"
            echo "| build | ${{ needs.build.result }} |"
            echo "| lint | ${{ needs.lint.result }} |"
            echo "| test (unit) | ${{ needs.test.result }} |"
            echo "| test (integration) | ${{ needs.integration-test.result }} |"
            echo "| coverage | ${{ needs.coverage.result }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required job did not succeed
        run: |
          if [ "${{ needs.build.result }}" != "success" ] \
          || [ "${{ needs.lint.result }}" != "success" ] \
          || [ "${{ needs.test.result }}" != "success" ] \
          || [ "${{ needs.integration-test.result }}" != "success" ] \
          || [ "${{ needs.coverage.result }}" != "success" ]; then
            echo "::error::api pipeline incomplete - see the table above"
            exit 1
          fi

      - name: Verify the pipeline contract is intact
        run: node scripts/check-required-scripts.mjs

      - name: Fail on new high or critical advisories
        run: node scripts/audit-gate.mjs

      - name: Scan the repository for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  image:
    name: build image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [quality-gate]
    if: inputs.deploy
    steps:
      - uses: actions/checkout@v4

      - name: Build the api image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: false
          tags: labops-api:${{ github.sha }}