name: changes

# Detects whether a push or pull request touched the frontend, the backend, or
# both, and dispatches the matching service workflow. A change confined to
# apps/web never runs the api pipeline, and vice versa.
#
# Why a dispatcher rather than `on: paths:` filters on each workflow: a single
# detection point means one place decides what "affected" means, and the run
# summary states explicitly which service was skipped and why.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: changes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  detect:
    name: detect affected services
    runs-on: ubuntu-latest
    outputs:
      web: ${{ steps.filter.outputs.web }}
      api: ${{ steps.filter.outputs.api }}
      tooling: ${{ steps.filter.outputs.tooling }}
    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Detect changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          list-files: shell
          # Shared build tooling lives at the root. A change to it can break
          # either service, so it fans out to both.
          filters: |
            web:
              - 'apps/web/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
            api:
              - 'apps/api/**'
              - 'package.json'
              - 'package-lock.json'
              - 'eslint.config.mjs'
              - 'docker-compose.yml'
              - 'db/**'
              - 'prisma/**'
            tooling:
              - '.github/workflows/**'
              - 'CLAUDE.md'
              - 'ARCHITECTURE.md'
              - '.claude/**'

      - name: Summarise detection result
        run: |
          {
            echo "### Affected services"
            echo ""
            echo "| Service | Runs |"
            echo "| ------- | ----- |"
            echo "| web (apps/web) | ${{ steps.filter.outputs.web }} |"
            echo "| api (apps/api) | ${{ steps.filter.outputs.api }} |"
            echo ""
            echo "Shared tooling changed: ${{ steps.filter.outputs.tooling }}"
          } >> "$GITHUB_STEP_SUMMARY"

  web:
    name: web pipeline
    needs: detect
    if: needs.detect.outputs.web == 'true'
    uses: ./.github/workflows/web.yml

  api:
    name: api pipeline
    needs: detect
    if: needs.detect.outputs.api == 'true'
    uses: ./.github/workflows/api.yml

  # Builds both images and boots the real stack, so a Dockerfile or startup
  # bug fails here instead of on the first `docker compose up`.
  compose-smoke:
    name: compose smoke and e2e
    needs: detect
    if: needs.detect.outputs.api == 'true' || needs.detect.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: docker compose build

      # A throwaway operator password per run; nothing is committed.
      - name: Generate the operator password
        run: |
          password="$(openssl rand -hex 16)"
          echo "::add-mask::$password"
          echo "SEED_OPERATOR_PASSWORD=$password" >> "$GITHUB_ENV"

      - name: Start the stack
        run: docker compose up -d

      - name: Check migrations, api and web
        run: scripts/compose-smoke.sh

      # The operator journey in a real browser. The smoke run already used the
      # demo scenario, so the journey gets a reset stack (same images, empty
      # volumes) and runs the scenario itself.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies and the browser
        run: |
          npm ci
          npx --prefix apps/web playwright install --with-deps chromium

      - name: Reset the stack for the journey
        run: |
          docker compose down -v
          docker compose up -d
          timeout 180 sh -c "until curl -fs http://localhost:3000/login | grep -Eq 'API: (<!-- -->)?ok'; do sleep 3; done"

      - name: Run the operator journey
        run: npm run test:e2e -w @labops/web

      # Screenshots only; the config never records traces, which hold cookies.
      - name: Keep the journey's screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-screenshots
          path: apps/web/test-results
          retention-days: 7

      - name: Show container logs
        if: failure()
        run: docker compose logs --no-color

      - name: Stop the stack
        if: always()
        run: docker compose down -v
